apply plugin: "java"

[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'

project.ext.mainClassName = "technology.rocketjump.mountaincore.launcher.DesktopLauncher"

task run(dependsOn: classes, type: JavaExec) {
    main = project.mainClassName
    classpath = sourceSets.main.runtimeClasspath
    standardInput = System.in
    // The game resolves "assets/..." against the working directory (see readme.md),
    // so run with core/ as the working dir. project.file() keeps this correct
    // no matter where Gradle is invoked from.
    workingDir = project.file("../core")
    ignoreExitValue = true
}

task dist(type: Jar) {
    duplicatesStrategy DuplicatesStrategy.INCLUDE
    manifest {
        attributes 'Main-Class': project.mainClassName
    }
    dependsOn configurations.runtimeClasspath
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    with jar
    archiveName 'mountaincore.jar'
}

dist.dependsOn classes

build.dependsOn dist

eclipse {
    project {
        name = appName + "-desktop"
        linkedResource name: 'assets', type: '2', location: 'PARENT-1-PROJECT_LOC/core/assets'
    }
}

task afterEclipseImport(description: "Post processing after project generation", group: "IDE") {
  doLast {
    def classpath = new XmlParser().parse(file(".classpath"))
    new Node(classpath, "classpathentry", [ kind: 'src', path: 'assets' ]);
    def writer = new FileWriter(file(".classpath"))
    def printer = new XmlNodePrinter(new PrintWriter(writer))
    printer.setPreserveWhitespace(true)
    printer.print(classpath)
  }
}
